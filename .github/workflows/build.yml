name: Build APK

on:
  push:
    branches: [master, beta]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TAG_NAME="v${VERSION_NAME}"
          IS_BETA=false
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            IS_BETA=true
            TAG_NAME="${TAG_NAME}-beta"
          fi
          APK_NAME="mp3tag-mobile-${TAG_NAME}-debug.apk"
          APK_ARM64="mp3tag-mobile-${TAG_NAME}-arm64-v8a-debug.apk"
          APK_X86_64="mp3tag-mobile-${TAG_NAME}-x86_64-debug.apk"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_arm64=${APK_ARM64}" >> "$GITHUB_OUTPUT"
          echo "apk_x86_64=${APK_X86_64}" >> "$GITHUB_OUTPUT"
          echo "build_base=mp3tag-mobile-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_beta=${IS_BETA}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare versioned APKs
        run: |
          cp "app/build/outputs/apk/debug/${{ steps.version.outputs.build_base }}-arm64-v8a-debug.apk" "${{ steps.version.outputs.apk_arm64 }}"
          cp "app/build/outputs/apk/debug/${{ steps.version.outputs.build_base }}-x86_64-debug.apk" "${{ steps.version.outputs.apk_x86_64 }}"
          ls -lh "${{ steps.version.outputs.apk_arm64 }}" "${{ steps.version.outputs.apk_x86_64 }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp3tag-mobile-${{ steps.version.outputs.tag }}-debug
          path: |
            ${{ steps.version.outputs.apk_arm64 }}
            ${{ steps.version.outputs.apk_x86_64 }}

      - name: Publish versioned GitHub Release (${{ steps.version.outputs.tag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_ARM64="${{ steps.version.outputs.apk_arm64 }}"
          APK_X86_64="${{ steps.version.outputs.apk_x86_64 }}"
          TITLE="MP3Tag Mobile ${TAG} (build ${{ steps.version.outputs.version_code }})"
          NOTES="Release **${TAG}** (versionCode ${{ steps.version.outputs.version_code }}).

          - **arm64-v8a APK**: \`${APK_ARM64}\` — for phones and DAPs (install this one)
          - **x86_64 APK**: \`${APK_X86_64}\` — for Android emulators
          - **Commit**: ${{ github.sha }}

          Download the APK that matches your device (almost certainly arm64-v8a) and open it to install or update."

          if [ "${{ steps.version.outputs.is_beta }}" = "true" ]; then
            RELEASE_FLAGS="--prerelease"
          else
            RELEASE_FLAGS="--latest"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_ARM64}" "${APK_X86_64}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" ${RELEASE_FLAGS}
          else
            gh release create "${TAG}" "${APK_ARM64}" "${APK_X86_64}" \
              --target "${{ github.sha }}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              ${RELEASE_FLAGS}
          fi
