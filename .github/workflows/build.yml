name: Build APK

on:
  push:
    branches: [master, beta]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TAG_NAME="v${VERSION_NAME}"
          IS_BETA=false
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            IS_BETA=true
            TAG_NAME="${TAG_NAME}-beta"
          fi
          APK_NAME="mp3tag-mobile-${TAG_NAME}-debug.apk"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_apk=mp3tag-mobile-v${VERSION_NAME}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "is_beta=${IS_BETA}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare versioned APK
        run: cp "app/build/outputs/apk/debug/${{ steps.version.outputs.build_apk }}" "${{ steps.version.outputs.apk_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp3tag-mobile-${{ steps.version.outputs.tag }}-debug
          path: ${{ steps.version.outputs.apk_name }}

      - name: Publish versioned GitHub Release (${{ steps.version.outputs.tag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.version.outputs.apk_name }}"
          TITLE="MP3Tag Mobile ${TAG} (build ${{ steps.version.outputs.version_code }})"
          NOTES="Release **${TAG}** (versionCode ${{ steps.version.outputs.version_code }}).

          - **APK**: \`${APK}\`
          - **Commit**: ${{ github.sha }}

          Download \`${APK}\` and open it on your Android device to install or update."

          if [ "${{ steps.version.outputs.is_beta }}" = "true" ]; then
            RELEASE_FLAGS="--prerelease"
          else
            RELEASE_FLAGS="--latest"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" ${RELEASE_FLAGS}
          else
            gh release create "${TAG}" "${APK}" \
              --target "${{ github.sha }}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              ${RELEASE_FLAGS}
          fi
