name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mp3tag-mobile-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp3tag-mobile-debug
          path: mp3tag-mobile-debug.apk

      # Rolling "latest" release: one stable URL that always has the newest APK.
      - name: Update latest release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --prerelease \
              --notes "Automated build of master. Always the newest APK.

          Download and open on your phone to install (allow unknown sources).
          Commit: ${{ github.sha }}"
          gh release upload latest mp3tag-mobile-debug.apk --clobber
          gh release edit latest --notes "Automated build of master (commit ${{ github.sha }}).

          Download and open on your phone to install (allow unknown sources)."

      # Versioned releases when a tag like v0.3.0 is pushed.
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" mp3tag-mobile-debug.apk \
            --title "${GITHUB_REF_NAME}" \
            --notes "Debug APK build for ${GITHUB_REF_NAME}." \
            --latest
